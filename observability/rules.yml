groups:
  - name: jalani
    rules:
      - alert: BackendUnavailable
        expr: up{job="jalani-backend"} == 0
        for: 20s
        labels: {severity: critical}
        annotations: {summary: 'Backend metrics endpoint is unreachable'}
      - alert: SimulatorDataUnavailable
        expr: sim_up == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: 'Real simulator data reads are failing'}
      - alert: StaleSimulatorData
        expr: state_stale == 1 or state_age_seconds > 15
        for: 10s
        labels: {severity: warning}
        annotations: {summary: 'Data freshness gate is blocking allocation execution'}
      - alert: AllocationFailures
        expr: increase(sim_allocation_failures[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Allocation failures increased; inspect route status and audit'}
