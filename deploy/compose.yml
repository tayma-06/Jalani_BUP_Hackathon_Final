# Consumed from a release directory with --env-file /srv/jalani/.env and release.env.
services:
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    restart: unless-stopped
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      TICK_MINUTES: '15'
      SIMULATOR_START_MODE: paused
    ports: ['127.0.0.1:8000:8000']
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  backend:
    image: ${BACKEND_IMAGE:?digest required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      SIMULATOR_URL: ${SIMULATOR_URL:-http://simulator:8000}
      JWT_SECRET: ${JWT_SECRET:?required}
      VIEWER_USER: ${VIEWER_USER:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?required}
      OPERATOR_USER: ${OPERATOR_USER:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?required}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      CHAOS_ENABLED: 'false'
      APP_VERSION: ${APP_VERSION:?required}
      GIT_SHA: ${GIT_SHA:?required}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?required}
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  frontend:
    image: ${FRONTEND_IMAGE:?digest required}
    restart: unless-stopped
    # Access remotely through SSH forwarding, or add an HTTPS reverse proxy.
    ports: ['127.0.0.1:3000:80']
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  # A host without these can still serve traffic, but its alerts fire into a void and the
  # evidence for an incident is lost, so they ship with the release.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/alertmanager/entrypoint.sh']
    environment:
      # Must equal the backend's ALERT_WEBHOOK_TOKEN or every delivery is rejected.
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?required}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    depends_on: [backend]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    depends_on: [alertmanager]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
