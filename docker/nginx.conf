server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Conservative headers for a browser-facing control room. HSTS is deliberately absent: the
    # demo and the default deployment serve plain HTTP on loopback, and a browser that learns
    # the HSTS rule for a local address cannot be talked out of it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Meaningful health: the console is only useful if it can reach the API, so this reports
    # the backend's liveness rather than a hardcoded string. Liveness, not readiness, so a
    # degraded simulator does not make the frontend container look broken.
    location = /health {
        access_log off;
        set $backend http://backend:8080;
        proxy_pass $backend/api/health/live;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location /assets/ {
        # Vite fingerprints these filenames, so they are safe to cache for a year.
        expires 1y;
        # nginx replaces the whole inherited header set once a location declares any add_header,
        # so a bare Cache-Control here would silently drop CSP and nosniff from every asset.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
