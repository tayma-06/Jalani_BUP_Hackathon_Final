# Disposable stack. NEVER point these tests at the live/demo simulator.
services:
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: '1'
      TICK_MINUTES: '15'
      SIMULATOR_START_MODE: paused
    ports: ['127.0.0.1:18000:8000']
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jalani
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: jalani
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jalani -d jalani']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: jalani-backend:ci
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-ci}
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      DATABASE_URL: postgresql+psycopg://jalani:ci-only-password@db:5432/jalani
      SIMULATOR_URL: http://simulator:8000
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      VIEWER_USER: viewer
      VIEWER_PASSWORD: ci-viewer
      OPERATOR_USER: operator
      OPERATOR_PASSWORD: ci-operator
      ADMIN_USER: admin
      ADMIN_PASSWORD: ci-admin
      CHAOS_ENABLED: 'false'
      LLM_API_KEY: ''
      ML_SERVICE_URL: ''
      APP_VERSION: ${APP_VERSION:-ci}
      GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:18080:8080']
  frontend:
    image: jalani-frontend:ci
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-ci}
        GIT_SHA: ${GIT_SHA:-dev}
    ports: ['127.0.0.1:13000:80']
