name: Jalani CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Avoid interrupting a deployment in progress. PR verification can be superseded.
concurrency:
  group: jalani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
      APP_VERSION: ${{ github.ref_name }}
      COMPOSE_PROJECT_NAME: jalani-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_USER: operator
      SMOKE_PASSWORD: ci-operator
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require real application files
        run: python scripts/ci_preflight.py
      - name: Lint and test backend and automation
        run: |
          mkdir -p artifacts
          python -m pip install -r backend/requirements-dev.lock
          python -m ruff check backend
          PYTHONPATH=backend python -m pytest backend/tests --junitxml=artifacts/backend-tests.xml
          python -m unittest discover -s tests_ci -v
          python -m compileall -q scripts
          bash -n scripts/deploy.sh scripts/rollback.sh
      - name: Lint, type-check, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:ci
          npm run build
      - name: Build images once and start disposable stack
        run: |
          docker compose -f compose.ci.yml config --quiet
          docker compose -f compose.ci.yml build --pull backend frontend
          docker compose -f compose.ci.yml up -d
      - name: Test official simulator, app and fault recovery
        run: |
          python scripts/simulator_contract.py --allow-reset
          python scripts/app_smoke.py --expected-sha "$GIT_SHA"
          python scripts/fault_probe.py --isolated-ci --expected-sha "$GIT_SHA"
          ADMIN_PASSWORD=ci-admin OPERATOR_PASSWORD=ci-operator VIEWER_PASSWORD=ci-viewer \
            python scripts/e2e_drill.py --base http://127.0.0.1:13000 --simulator http://127.0.0.1:18000 --allow-reset
      - name: Verify alert firing, delivery, audit and resolution
        run: |
          python scripts/alert_delivery_probe.py --base http://127.0.0.1:13000 \
            --simulator http://127.0.0.1:18000 --prometheus http://127.0.0.1:19090 \
            --alertmanager http://127.0.0.1:19093 --allow-fault --output artifacts/alert-delivery.json
      - name: Save the tested image bytes for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save -o artifacts/tested-images.tar jalani-backend:ci jalani-frontend:ci
      - name: Capture diagnostics before cleanup
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f compose.ci.yml ps -a > artifacts/containers.txt || true
          docker compose -f compose.ci.yml logs --no-color --tail=300 > artifacts/compose.log 2>&1 || true
      - name: Store evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence
          path: |
            artifacts/*.json
            artifacts/*.xml
            artifacts/*.txt
            artifacts/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Store tested images
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: tested-images
          path: artifacts/tested-images.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Remove disposable CI stack only
        if: always()
        run: docker compose -f compose.ci.yml down -v --remove-orphans

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release must belong to main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v8
        with:
          name: tested-images
          path: artifacts
      - name: Load tested images
        run: docker load -i artifacts/tested-images.tar
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish without rebuilding and assemble release
        run: python3 scripts/publish_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            artifacts/release-bundle.tgz
            artifacts/manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Logout
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: release
    if: vars.ENABLE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: jalani-staging-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/srv/jalani' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: artifacts
      - name: Configure verified SSH access
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer and deploy immutable release
        run: |
          archive="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/incoming' '$DEPLOY_ROOT/releases'"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes artifacts/release-bundle.tgz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/incoming/$archive"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_ROOT" "$GITHUB_SHA" "$archive" <<'REMOTE'
          set -Eeuo pipefail
          root=$1
          sha=$2
          archive=$3
          temp=$(mktemp -d "$root/incoming/release.XXXXXX")
          trap 'rm -rf -- "$temp"' EXIT
          tar --no-same-owner -xzf "$root/incoming/$archive" -C "$temp"
          actual=$(python3 "$temp/scripts/manifest.py" "$temp/manifest.json" --env-output "$temp/release.env")
          [[ "$actual" == "$sha" ]]
          if [[ -d "$root/releases/$sha" ]]; then
            cmp "$temp/manifest.json" "$root/releases/$sha/manifest.json"
          else
            mv "$temp" "$root/releases/$sha"
          fi
          bash "$root/releases/$sha/scripts/deploy.sh" "$root"
          REMOTE
      - name: Collect non-secret deployment evidence
        if: always()
        run: |
          mkdir -p artifacts/host
          scp -r -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/evidence/$GITHUB_SHA/." artifacts/host/ || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-evidence
          path: artifacts/host/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
