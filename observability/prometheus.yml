global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ['/etc/prometheus/rules.yml']
alerting:
  alertmanagers:
    # Static_configs resolves inside the monitoring network, so the same file works locally
    # and in deploy/compose.yml without editing.
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: jalani-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
